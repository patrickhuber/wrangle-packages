package:
  name: spin
  version: 4.2.4
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - spin
    steps:
    - action: download
      with:
        url: https://github.com/spinframework/spin/releases/download/v4.2.4/spin-v4.2.4-linux-amd64.tar.gz
        out: spin-v4.2.4-linux-amd64.tar.gz
    - action: extract
      with:
        archive: spin-v4.2.4-linux-amd64.tar.gz
  - platform: linux
    architecture: arm64
    executables:
    - spin
    steps:
    - action: download
      with:
        url: https://github.com/spinframework/spin/releases/download/v4.2.4/spin-v4.2.4-linux-aarch64.tar.gz
        out: spin-v4.2.4-linux-aarch64.tar.gz
    - action: extract
      with:
        archive: spin-v4.2.4-linux-aarch64.tar.gz
  - platform: darwin
    architecture: amd64
    executables:
    - spin
    steps:
    - action: download
      with:
        url: https://github.com/spinframework/spin/releases/download/v4.2.4/spin-v4.2.4-macos-amd64.tar.gz
        out: spin-v4.2.4-macos-amd64.tar.gz
    - action: extract
      with:
        archive: spin-v4.2.4-macos-amd64.tar.gz
  - platform: darwin
    architecture: arm64
    executables:
    - spin
    steps:
    - action: download
      with:
        url: https://github.com/spinframework/spin/releases/download/v4.2.4/spin-v4.2.4-macos-aarch64.tar.gz
        out: spin-v4.2.4-macos-aarch64.tar.gz
    - action: extract
      with:
        archive: spin-v4.2.4-macos-aarch64.tar.gz
  - platform: windows
    architecture: amd64
    executables:
    - spin.exe
    steps:
    - action: download
      with:
        url: https://github.com/spinframework/spin/releases/download/v4.2.4/spin-v4.2.4-windows-amd64.zip
        out: spin-v4.2.4-windows-amd64.zip
    - action: extract
      with:
        archive: spin-v4.2.4-windows-amd64.zip

