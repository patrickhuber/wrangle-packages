package:
  name: fly
  version: 8.1.1
  targets:
  - platform: darwin
    architecture: amd64
    executables:
    - fly
    steps:
    - action: download
      with:
        url: https://github.com/concourse/concourse/releases/download/v8.1.1/fly-8.1.1-darwin-amd64.tgz
        out: fly-8.1.1-darwin-amd64.tgz
    - action: extract
      with:
        archive: fly-8.1.1-darwin-amd64.tgz
  - platform: linux
    architecture: amd64
    executables:
    - fly
    steps:
    - action: download
      with:
        url: https://github.com/concourse/concourse/releases/download/v8.1.1/fly-8.1.1-linux-amd64.tgz
        out: fly-8.1.1-linux-amd64.tgz
    - action: extract
      with:
        archive: fly-8.1.1-linux-amd64.tgz
  - platform: windows
    architecture: amd64
    executables:
    - fly.exe
    steps:
    - action: download
      with:
        url: https://github.com/concourse/concourse/releases/download/v8.1.1/fly-8.1.1-windows-amd64.zip
        out: fly-8.1.1-windows-amd64.zip
    - action: extract
      with:
        archive: fly-8.1.1-windows-amd64.zip