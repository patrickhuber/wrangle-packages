package:
  name: bosh
  version: 7.2.2
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.2.2/bosh-cli-7.2.2-linux-amd64
        out: bosh
  - platform: darwin
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.2.2/bosh-cli-7.2.2-darwin-amd64
        out: bosh
  - platform: windows
    architecture: amd64
    executables:
    - bosh.exe
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.2.2/bosh-cli-7.2.2-windows-amd64.exe
        out: bosh.exe