package:
  name: bosh
  version: 6.2.0
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.2.0/bosh-cli-6.2.0-linux-amd64
        out: bosh
  - platform: darwin
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.2.0/bosh-cli-6.2.0-darwin-amd64
        out: bosh
  - platform: windows
    architecture: amd64
    executables:
    - bosh.exe
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.2.0/bosh-cli-6.2.0-windows-amd64.exe
        out: bosh.exe