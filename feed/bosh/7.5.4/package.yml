package:
  name: bosh
  version: 7.5.4
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.5.4/bosh-cli-7.5.4-linux-amd64
        out: bosh
  - platform: darwin
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.5.4/bosh-cli-7.5.4-darwin-amd64
        out: bosh
  - platform: windows
    architecture: amd64
    executables:
    - bosh.exe
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v7.5.4/bosh-cli-7.5.4-windows-amd64.exe
        out: bosh.exe