package:
  name: bosh
  version: 6.4.5
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.4.5/bosh-cli-6.4.5-linux-amd64
        out: bosh
  - platform: darwin
    architecture: amd64
    executables:
    - bosh
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.4.5/bosh-cli-6.4.5-darwin-amd64
        out: bosh
  - platform: windows
    architecture: amd64
    executables:
    - bosh.exe
    steps:
    - action: download
      with:
        url: https://github.com/cloudfoundry/bosh-cli/releases/download/v6.4.5/bosh-cli-6.4.5-windows-amd64.exe
        out: bosh.exe