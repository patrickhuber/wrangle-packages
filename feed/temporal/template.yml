package:
  name: temporal
  version: {{ .version }}
  targets:
  {{- range .platforms }}
  {{- $platform := .platform }}
  {{- range .architectures }}
  {{- $architecture := . }}
  - platform: {{ $platform }}
    architecture: {{ $architecture }}
    {{- $extension := "" -}}
    {{- if eq $platform "windows" -}}
      {{- $extension = ".exe" -}}
    {{- end }}
    executables:
    - temporal{{ $extension }}
    steps:
    {{- $archive := ".tar.gz" -}}
    {{- if eq $platform "windows" -}}
      {{- $archive = ".zip" -}}
    {{- end }}
    - action: download
      with:
        url: https://github.com/temporalio/cli/releases/download/v{{ $.version }}/temporal_cli_{{ $.version }}_{{ $platform }}_{{ $architecture }}{{ $archive }}
        out: temporal-{{ $.version }}-{{ $platform }}-{{ $architecture }}{{ $archive }}
    - action: extract
      with:
        archive: temporal-{{ $.version }}-{{ $platform }}-{{ $architecture }}{{ $archive }}
  {{- end }}
  {{- end }}
