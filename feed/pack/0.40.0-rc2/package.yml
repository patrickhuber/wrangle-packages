package:
  name: pack
  version: 0.40.0-rc2
  targets:
  - platform: linux
    architecture: amd64
    executables:
    - pack
    steps:
    - action: download
      with:
        url: https://github.com/buildpacks/pack/releases/download/v0.40.0-rc2/pack-v0.40.0-rc2-linux.tgz
        out: pack-0.40.0-rc2-linux-amd64.tgz
    - action: extract
      with:
        archive: pack-0.40.0-rc2-linux-amd64.tgz
  - platform: darwin
    architecture: amd64
    executables:
    - pack
    steps:
    - action: download
      with:
        url: https://github.com/buildpacks/pack/releases/download/v0.40.0-rc2/pack-v0.40.0-rc2-macos.tgz
        out: pack-0.40.0-rc2-darwin-amd64.tgz
    - action: extract
      with:
        archive: pack-0.40.0-rc2-darwin-amd64.tgz
  - platform: darwin
    architecture: arm64
    executables:
    - pack
    steps:
    - action: download
      with:
        url: https://github.com/buildpacks/pack/releases/download/v0.40.0-rc2/pack-v0.40.0-rc2-macos-arm64.tgz
        out: pack-0.40.0-rc2-darwin-arm64.tgz
    - action: extract
      with:
        archive: pack-0.40.0-rc2-darwin-arm64.tgz
  - platform: windows
    architecture: amd64
    executables:
    - pack.exe
    steps:
    - action: download
      with:
        url: https://github.com/buildpacks/pack/releases/download/v0.40.0-rc2/pack-v0.40.0-rc2-windows.zip
        out: pack-0.40.0-rc2-windows-amd64.zip
    - action: extract
      with:
        archive: pack-0.40.0-rc2-windows-amd64.zip